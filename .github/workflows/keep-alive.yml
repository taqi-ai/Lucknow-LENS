name: Keep Render awake

# Render's free tier sleeps after ~15 minutes without traffic. Pinging the
# health endpoint every 5 minutes keeps TERRALYT LUCKNOW warm. GitHub's cron
# minimum is 5 minutes and runs can start late, which still leaves headroom.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 15 --retry-all-errors \
            --max-time 60 \
            https://terralyt.onrender.com/api/health
